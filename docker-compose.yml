services:
  go_logdrain:
    build: .
    image: go_logdrain:latest
    container_name: go_logdrain
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
    environment:
      - PORT=${PORT:-4000}
      - VERCEL_WEBHOOK_SECRET=${VERCEL_WEBHOOK_SECRET}
      - LOG_FLUSH_INTERVAL=${LOG_FLUSH_INTERVAL:-15}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "1"
        reservations:
          memory: 32M
          cpus: "0.25"
    volumes:
      - go_logdrain_data:/home/app/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${PORT:-4000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  go_logdrain_data:
